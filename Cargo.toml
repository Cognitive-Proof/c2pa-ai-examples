[package]
name = "c2pa-ai-examples"
version = "0.1.0"
edition = "2021"
publish = false
description = "Generates C2PA-signed test assets labelled AI / includes AI / no AI / unknown"

[dependencies]
# Built against the local c2pa-rs checkout next to this repository.
c2pa = { path = "../c2pa-rs/sdk", features = ["file_io", "add_thumbnails"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
